{% if user.is_authenticated %}
    <form method="post" action="{% url 'main:toggle_skill_star' skill.id %}" class="star-form">
        {% csrf_token %}
        <button type="submit"
                class="button button-star{% if user in skill.starred_by.all %} is-starred{% endif %}">
            <span aria-hidden="true">&#9733;</span>
            {% if user in skill.starred_by.all %}Unstar{% else %}Star{% endif %}
            <span class="star-count">{{ skill.starred_by.count }}</span>
        </button>
    </form>
{% else %}
    <a href="{% url 'main:login' %}" class="button button-star" title="Login untuk memberi star">
        <span aria-hidden="true">&#9733;</span>
        Star
        <span class="star-count">{{ skill.starred_by.count }}</span>
    </a>
{% endif %}
